
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ficha de Inscrição Individuais - 25º Rodeio - CTG Chama Nativa</title>

<style>
header{
width:100%;
margin:0;
padding:0;
}

.testeira{
width:100%;
height:auto;
display:block;
}


body{font-family:Arial;background:#fff7f0;margin:0}
header img{width:100%}
main{max-width:1100px;margin:30px auto;background:#fff;padding:25px;border-radius:15px;box-shadow:0 0 12px rgba(0,0,0,.2)}
.section-title{background:#ff7a00;color:#fff;padding:12px;border-radius:10px;margin-top:40px;font-size:18px}
.category-box{border:2px solid #ffd2a8;padding:15px;border-radius:12px;margin-top:20px}
table{width:100%;border-collapse:collapse;margin-top:10px}
th,td{border:1px solid #ddd;padding:8px;font-size:14px;text-align:center}
th{background:#ffe0c2}
input,select{width:95%;padding:6px;border-radius:6px;border:1px solid #ccc}
.input-prenda{background:#ffe6ef}
.input-peao{background:#e6f0ff}
.input-danca{background:#fff6db;font-weight:bold}
.btn-add{margin-top:10px;background:#ff7a00;border:none;padding:7px 14px;color:white;border-radius:8px;cursor:pointer}
.btn-remove{background:red;color:white;border:none;padding:5px 10px;border-radius:6px;cursor:pointer}
.suplente{background:#fff3cd!important;border:2px solid #ff9900}
.botoes-final{display: flex; justify-content: center; gap: 20px; margin: 50px auto 0 auto; max-width: 600px;}
.btn-submit,.btn-voltar{width:100%;padding:14px;background:#ff7a00;color:white;border:none;font-size:18px;border-radius:12px;cursor:pointer;text-decoration:none;text-align:center}
.btn-submit:hover,.btn-voltar:hover{background:#ffd24d;color:#000;transition:0.2s}
.accordion-btn { width: 100%; background: #fff; border: 2px solid #ff7a00; color: #ff7a00; padding: 15px; text-align: left; font-size: 18px; font-weight: bold; cursor: pointer; border-radius: 8px; transition: 0.2s; }
.accordion-btn:hover { background: #fff5eb; }
#contador { background: #ff7a00; color: #fff; text-align: center; padding: 14px; font-weight: bold; }
/* MODAL */
.modal{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:999}
.modal-content{background:#fff;padding:20px;border-radius:12px;width:300px;text-align:center}
.modal-content h3{margin-top:0}
.modal-content button{margin-top:15px;padding:8px 16px;border:none;border-radius:6px;cursor:pointer}

.loading-overlay{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(255, 255, 255, 0.7);
display:none;
align-items:center;
justify-content:center;
flex-direction:column;
z-index:9999;
color:rgb(2, 2, 2);
font-family:Arial;
text-align:center;
}
  footer {
      text-align: center;
      margin-top: 20px;
      font-size: 12px;
      color: gray;
    }

    .regulamento-box {
  margin-top: 20px;
  padding: 12px;
  background: #fff3e0;
  border: 2px solid #ff7a00;
  border-radius: 10px;
  font-size: 14px;
}

.regulamento-box a {
  color: #cc5f00;
  font-weight: bold;
  text-decoration: none;
}

.regulamento-box a:hover {
  text-decoration: underline;
}
.regulamento-box input[type="checkbox"] {
  width: auto;
  transform: scale(1.2);
  margin-right: 8px;
}
</style>
</head>

<body>

<div class="loading-overlay" id="loading">
    <h2 style="color: #ff7a00;">Processando Inscrição...</h2>
    <p>Aguarde, estamos salvando os dados....</p>
</div>    

<header>
  <img class="testeira"
       src="https://raw.githubusercontent.com/CCN1989/fichadeinscricao_25rodeio/refs/heads/main/testeira%20ficha%20ind.png"
       alt="Testeira Oficial">
</header>

<main>
<form id="formInscricao">
<div class="section-title">Dados da Entidade</div>
<div class="category-box">
<table>
<tr>
<td>Entidade *</td><td><input id="entidade" required></td>
<td>Município *</td><td><input id="municipio" required></td>
</tr>
<tr>
<td>RT *</td>
                    <td>
                        <select id="rt" required>
                            <option value="">Selecione</option>
                            <script>for(let i=1; i<=30; i++) document.write(`<option>${i}ª RT</option>`);</script>
                        </select>
                    </td>
<td>Email *</td><td><input id="email" required></td>
</tr>
<tr>
<td>Patrão</td><td><input id="patrao"></td>
<td>Whats *</td><td><input id="whats" required></td>
</tr>
<tr>
<td>Responsável *</td>
<td colspan="3"><input id="responsavel" required></td>
</tr>
</table>
</div>
<!-- ✅ CHECKBOX REGULAMENTO -->
<div class="regulamento-box">
  <label>
    <input type="checkbox" required>
    Declaro que li e estou de acordo com o
    <a href="https://drive.google.com/uc?export=download&id=1qlSOrR6lkcLnH1dS_6An4OESMQp7BjH_" target="_blank">
      Regulamento Oficial do Rodeio
    </a>.
  </label>
</div>

<div id="modalidades"></div>

<div class="botoes-final">
<button  type="button" class="btn-submit" id="btnEnviar" onclick="enviarInscricao()">
ENVIAR INSCRIÇÃO
</button>
<a class="btn-voltar" href="https://www.ctgchamanativa.com.br">VOLTAR AO SITE</a>
</div>

</form>
</main>

<div class="modal" id="modalCategoria">
  <div class="modal-content">
    <h3>Selecionar categoria</h3>
    <select id="selectCategoria"></select><br>
    <button onclick="confirmarCategoria()">Confirmar</button>
    <button onclick="fecharModal()">Cancelar</button>
  </div>
</div>

<footer>
  Sistema de inscrição - CTG Chama Nativa © 2026 - dúvidas secretaria@ctgchamanativa.com.br
</footer>

<script>
const URL_GS="https://script.google.com/macros/s/AKfycbxwX5dl10ZRmf5yFiCHgQk9_61oI6rSpaI5AAJGI2zOTWcgCRaT5gmIS_4juBzrcpEr/exec";
const LIMITE=3;
let tipoAtual="";

const categoriasPrendaPeao=[
"Prenda Pré-Mirim","Peão Pré-Mirim",
"Prenda Mirim","Peão Mirim",
"Prenda Juvenil","Peão Juvenil",
"Prenda Adulta","Peão Adulto",
"Prenda Veterana","Peão Veterano",
"Prenda Xirú","Peão Xirú"
];
const categoriasGerais=["Pré-Mirim","Mirim","Juvenil","Adulta","Veterana","Xirú"];

const modalidades=[
{nome:"Declamação",tipo:"declamacao"},
{nome:"Intérprete Vocal",tipo:"vocal"},
{nome:"Chula",tipo:"chula"},
{nome:"Danças Tradicionais (Par)",tipo:"tradicional"},
{nome:"Danças Gaúchas de Salão (Par)",tipo:"par"}
];

const mapaModalidade={
declamacao:"Declamação",
vocal:"Intérprete Vocal",
chula:"Chula",
tradicional:"Danças Tradicionais (Par)",
par:"Danças Gaúchas de Salão (Par)"
};

function criarTabela(m){
return`
<div class="section-title">${m.nome}</div>
<div class="category-box">
<table>
<thead><tr>${cabecalho(m.tipo)}<th>Ação</th></tr></thead>
<tbody id="${m.tipo}-body"></tbody>
</table>
<button class="btn-add" onclick="abrirModal('${m.tipo}')">+ Adicionar</button>
</div>`;
}

function cabecalho(tipo){
if(tipo==="declamacao")return"<th>Categoria</th><th>Concorrente</th><th>Nasc.</th><th>Cartão</th><th>Amadrinhador</th>";
if(tipo==="vocal"||tipo==="chula")return"<th>Categoria</th><th>Concorrente</th><th>Nasc.</th><th>Cartão</th>";
if(tipo==="tradicional")return"<th>Categoria</th><th>Prenda</th><th>Nasc.</th><th>Cartão</th><th>Peão</th><th>Nasc.</th><th>Cartão</th><th>Dança</th>";
if(tipo==="par")return"<th>Categoria</th><th>Prenda</th><th>Nasc.</th><th>Cartão</th><th>Peão</th><th>Nasc.</th><th>Cartão</th>";
}

function abrirModal(tipo){
tipoAtual=tipo;
const sel=document.getElementById("selectCategoria");
sel.innerHTML="";
const lista=(tipo==="declamacao"||tipo==="vocal")?categoriasPrendaPeao:categoriasGerais;
lista.forEach(c=>{
let o=document.createElement("option");
o.value=c;o.textContent=c;
sel.appendChild(o);
});
document.getElementById("modalCategoria").style.display="flex";
}
function fecharModal(){document.getElementById("modalCategoria").style.display="none"}
function confirmarCategoria(){addRow(tipoAtual,selectCategoria.value);fecharModal()}

function tornarObrigatorios(tr){
tr.querySelectorAll("input").forEach(i=>i.required=true);
}

function addRow(tipo,categoria){
const tbody=document.getElementById(`${tipo}-body`);
let total=0;
[...tbody.rows].forEach(r=>{
if(r.querySelector(".categoria").value===categoria)total++;
});
if(total>=LIMITE)return alert("Limite de 2 titulares + 1 suplente atingido.");

const tr=document.createElement("tr");
if(total===2)tr.classList.add("suplente");
const cat=`<select class="categoria"><option>${categoria}</option></select>`;
const del=`<button class="btn-remove" onclick="this.closest('tr').remove()">X</button>`;

if(tipo==="declamacao")
tr.innerHTML=`<td>${cat}</td><td><input></td><td><input type="date"></td><td><input></td><td><select><option>Não</option><option>Sim</option></select></td><td>${del}</td>`;
if(tipo==="vocal")
tr.innerHTML=`<td>${cat}</td><td><input></td><td><input type="date"></td><td><input></td><td>${del}</td>`;
if(tipo==="chula")
tr.innerHTML=`<td>${cat}</td><td><input class="input-peao"></td><td><input type="date"></td><td><input></td><td>${del}</td>`;
if(tipo==="tradicional")
tr.innerHTML=`<td>${cat}</td><td><input class="input-prenda"></td><td><input type="date"></td><td><input></td>
<td><input class="input-peao"></td><td><input type="date"></td><td><input></td><td><input class="input-danca"></td><td>${del}</td>`;
if(tipo==="par")
tr.innerHTML=`<td>${cat}</td><td><input class="input-prenda"></td><td><input type="date"></td><td><input></td>
<td><input class="input-peao"></td><td><input type="date"></td><td><input></td><td>${del}</td>`;

tornarObrigatorios(tr);
tbody.appendChild(tr);
}

function coletarInscricoes(){
let lista=[];
modalidades.forEach(m=>{
const tbody=document.getElementById(`${m.tipo}-body`);
[...tbody.rows].forEach(tr=>{
let valores=[tr.querySelector(".categoria").value];
tr.querySelectorAll("input,select").forEach((el,i)=>{
if(i>0) valores.push(el.value);
});
lista.push({
modalidade:mapaModalidade[m.tipo],
valores:valores,
suplente:tr.classList.contains("suplente")
});
});
});
return lista;
}

function enviarInscricao(){

const btn=document.getElementById("btnEnviar");

/* VALIDA DADOS DA ENTIDADE */
if(!validarDadosEntidade()){
return;
}

const inscricoes=coletarInscricoes();

if(!inscricoes.length){
alert("Nenhuma inscrição adicionada.");
return;
}

/* MOSTRA LOADING SOMENTE DEPOIS DA VALIDAÇÃO */
document.getElementById("loading").style.display="flex";

btn.disabled=true;
btn.textContent="Enviando...";
btn.style.cursor="wait";
btn.style.opacity="0.7";

fetch(URL_GS,{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({
entidade:entidade.value,
municipio:municipio.value,
rt:rt.value,
email:email.value,
patrao:patrao.value,
whats:whats.value,
responsavel:responsavel.value,
inscricoes:inscricoes
})
})
.then(r=>r.text())
.then(msg=>{
alert(msg);
location.reload();
})
.catch(()=>{
alert("Erro no envio");
document.getElementById("loading").style.display="none";
});


function restaurarBotao(){
btn.disabled=false;
btn.textContent="Enviar Inscrição";
btn.style.cursor="pointer";
btn.style.opacity="1";
}
}

const cont=document.getElementById("modalidades");
modalidades.forEach(m=>cont.innerHTML+=criarTabela(m));

function validarDadosEntidade(){

if(!entidade.value.trim()){
alert("Informe o nome da entidade.");
entidade.focus();
return false;
}

if(!municipio.value.trim()){
alert("Informe o município.");
municipio.focus();
return false;
}

if(!rt.value){
alert("Selecione a RT.");
rt.focus();
return false;
}

if(!email.value.trim()){
alert("Informe o e-mail.");
email.focus();
return false;
}

if(!whats.value.trim()){
alert("Informe o WhatsApp.");
whats.focus();
return false;
}

if(!responsavel.value.trim()){
alert("Informe o responsável.");
responsavel.focus();
return false;
}

return true;

}

</script>

</body>
</html>
