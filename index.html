<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ficha de Inscrição - 25º Rodeio Nativista</title>

   <style>
    body {
  font-family: Arial, sans-serif;
  background: #fff7f0;
  margin: 0;
  padding: 0;
}

    header {
  width: 100vw;       /* largura total da tela */
  margin: 0;
  padding: 0;
  overflow: hidden;
}

    header img {
      width: 85px;
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      max-width: 1100px;
      margin: auto;
    }

    main {
      max-width: 1100px;
      margin: 30px auto;
      background: white;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0px 0px 12px rgba(0,0,0,0.2);
    }

    .section-title {
      background: #ff7a00;
      color: white;
      padding: 12px;
      border-radius: 10px;
      margin-top: 40px;
      font-size: 18px;
    }

    .category-box {
      border: 2px solid #ffd2a8;
      padding: 15px;
      border-radius: 12px;
      margin-top: 20px;
    }

    .category-box h3 {
      margin: 0;
      color: #cc5f00;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
    }

    th, td {
      border: 1px solid #ddd;
      padding: 8px;
      font-size: 14px;
      text-align: center;
    }

    th {
      background: #ffe0c2;
    }

    input {
      width: 95%;
      padding: 6px;
      border-radius: 6px;
      border: 1px solid #ccc;
    }

    /* 🎨 CORES */
    .input-prenda {
      background: #ffe6ef;
      border: 1px solid #ff99bb;
    }

    .input-peao {
      background: #e6f0ff;
      border: 1px solid #77aaff;
    }

    .input-danca {
      background: #fff6db;
      border: 1px solid #ffcc66;
      font-weight: bold;
    }

    .btn-add {
      margin-top: 10px;
      background: #ff7a00;
      border: none;
      padding: 7px 14px;
      color: white;
      border-radius: 8px;
      cursor: pointer;
    }

    .btn-remove {
      background: red;
      color: white;
      border: none;
      padding: 5px 10px;
      border-radius: 6px;
      cursor: pointer;
    }

    /* SUPLENTE */
    .suplente {
      background: #fff3cd !important;
      border: 2px solid #ff9900;
    }

    .tag-suplente {
      color: red;
      font-size: 13px;
      font-weight: bold;
    }

    .btn-submit {
      margin-top: 50px;
      width: 100%;
      padding: 14px;
      background: #ff7a00;
      color: white;
      border: none;
      font-size: 18px;
      border-radius: 12px;
      cursor: pointer;
    }

    footer {
      text-align: center;
      margin-top: 20px;
      font-size: 12px;
      color: gray;
    }

    .regulamento-box {
  margin-top: 20px;
  padding: 12px;
  background: #fff3e0;
  border: 2px solid #ff7a00;
  border-radius: 10px;
  font-size: 14px;
}

.regulamento-box a {
  color: #cc5f00;
  font-weight: bold;
  text-decoration: none;
}

.regulamento-box a:hover {
  text-decoration: underline;
}

.regulamento-box input[type="checkbox"] {
  width: auto;
  transform: scale(1.2);
  margin-right: 8px;
}

header {
  padding: 0;
  margin: 0;
  width: 100%;
}

.testeira {
  width: 100vw;        /* ocupa toda a tela */
  max-width: 105%;     
  height: auto;
  display: block;
}

.botoes-final {
  display: flex;
  gap: 15px;
  margin-top: 50px;
}

.btn-voltar {
  width: 100%;
  padding: 14px;
  background: #555;
  color: white;
  border: none;
  font-size: 18px;
  border-radius: 12px;
  cursor: pointer;
  text-decoration: none;
  text-align: center;
}

.btn-voltar:hover {
  background: #333;
}


  </style>
</head>

<body>

<header>
  <div class="header-top">
    <!-- ✅ TESTEIRA IMAGEM -->
 <header>
  <img class="testeira"
       src="https://raw.githubusercontent.com/CCN1989/Imagens/refs/heads/main/testeira%20ficha%20ind.png"
       alt="Testeira Oficial">
</header>

  </div

    <img src="https://github.com/CCN1989/Imagens/blob/main/12RT.png?raw=true">
  </div>
</header>

<main>

  <div class="section-title">Dados da Entidade</div>

  <div class="category-box">
    <table>
      <tr>
        <td>Entidade *</td><td><input required></td>
        <td>Município *</td><td><input required></td>
      </tr>
      <tr>
        <td>RT *</td><td><input required></td>
        <td>Email *</td><td><input required></td>
      </tr>
      <tr>
        <td>Patrão</td><td><input></td>
        <td>WhatsApp *</td><td><input required></td>
      </tr>
      <tr>
        <td>Responsável Inscrição *</td>
        <td colspan="3"><input required></td>
      </tr>
    </table>
  </div>

</div>

<!-- ✅ CHECKBOX REGULAMENTO -->
<div class="regulamento-box">
  <label>
    <input type="checkbox" required>
    Declaro que li e estou de acordo com o
    <a href="REGULAMENTO.pdf" target="_blank">
      Regulamento Oficial do Rodeio
    </a>.
  </label>
</div>

<div id="modalidades"></div>


  <div id="modalidades"></div>

 <div class="botoes-final">

  <!-- ✅ BOTÃO ENVIAR -->
  <button class="btn-submit" type="submit">
    Enviar Inscrição
  </button>

  <!-- ✅ BOTÃO VOLTAR AO SITE -->
  <a class="btn-voltar" href="https://www.ctgchamanativa.com.br" target="_blank">
    Voltar ao Site
  </a>

</div>


</main>

<footer>
  Sistema de incrição - CTG Chama Nativa © 2026 - dúvidas secretaria@ctgchamanativa.com.br
</footer>

<script>
  const categorias = ["Pré-Mirim", "Mirim", "Juvenil", "Adulta", "Veterana", "Xirú"];
  const LIMITE = 3;

  const modalidades = [
    { nome: "Declamação", id: "declamacao", tipo: "declamacao" },
    { nome: "Intérprete Vocal", id: "vocal", tipo: "vocal" },
    { nome: "Chula", id: "chula", tipo: "chula" },
    { nome: "Danças Tradicionais (Par)", id: "tradicional", tipo: "tradicional" },
    { nome: "Danças Gaúchas de Salão (Par)", id: "salao", tipo: "par" }
  ];

  function criarCategoria(modId, categoria, tipo) {

    let colunas = "";

    if (tipo === "declamacao") {
      colunas = `
        <th>Prenda</th><th>Nascimento</th><th>Cartão</th>
        <th>Peão</th><th>Nascimento</th><th>Cartão</th>
        <th>Amadrinhador*</th>`;
    }

    if (tipo === "vocal") {
      colunas = `
        <th>Prenda</th><th>Nascimento</th><th>Cartão</th>
        <th>Peão</th><th>Nascimento</th><th>Cartão</th>`;
    }

    if (tipo === "chula") {
      colunas = `
        <th>Peão</th><th>Nascimento</th><th>Cartão</th>`;
    }

    if (tipo === "par") {
      colunas = `
        <th>Prenda</th><th>Nascimento</th><th>Cartão</th>
        <th>Peão</th><th>Nascimento</th><th>Cartão</th>`;
    }

    if (tipo === "tradicional") {
      colunas = `
        <th>Prenda</th><th>Nascimento</th><th>Cartão</th>
        <th>Peão</th><th>Nascimento</th><th>Cartão</th>
        <th>Dança Tradicional*</th>`;
    }

    let box = document.createElement("div");
    box.className = "category-box";

    box.innerHTML = `
      <h3>${categoria}</h3>
      <table>
        <thead>
          <tr>${colunas}<th>Ação</th></tr>
        </thead>
        <tbody id="${modId}-${categoria}-body"></tbody>
      </table>

      <button class="btn-add"
        onclick="addRow('${modId}','${categoria}','${tipo}')">
        + Adicionar (até 2 titulares + 1 suplente)
      </button>
    `;

    return box;
  }

  function addRow(modId, categoria, tipo) {

    let tbody = document.getElementById(`${modId}-${categoria}-body`);

    if (tbody.rows.length >= LIMITE) {
      alert("Limite máximo: 2 titulares + 1 suplente.");
      return;
    }

    let row = document.createElement("tr");

    let isSuplente = (tbody.rows.length === 2);
    if (isSuplente) row.classList.add("suplente");

    let suplenteTag = isSuplente
      ? `<div class="tag-suplente">SUPLENTE</div>`
      : "";

    let removerBtn = `<button class="btn-remove" onclick="removeRow(this)">X</button>`;

    /* DECLAMAÇÃO */
    if (tipo === "declamacao") {
      row.innerHTML = `
        <td><input class="input-prenda" placeholder="Prenda">${suplenteTag}</td>
        <td><input type="date"></td>
        <td><input placeholder="Cartão"></td>

        <td><input class="input-peao" placeholder="Peão"></td>
        <td><input type="date"></td>
        <td><input placeholder="Cartão"></td>

        <td><input required placeholder="Amadrinhador"></td>
        <td>${removerBtn}</td>
      `;
    }

    /* VOCAL */
    if (tipo === "vocal") {
      row.innerHTML = `
        <td><input class="input-prenda" placeholder="Prenda">${suplenteTag}</td>
        <td><input type="date"></td>
        <td><input placeholder="Cartão"></td>

        <td><input class="input-peao" placeholder="Peão"></td>
        <td><input type="date"></td>
        <td><input placeholder="Cartão"></td>

        <td>${removerBtn}</td>
      `;
    }

    /* CHULA */
    if (tipo === "chula") {
      row.innerHTML = `
        <td><input class="input-peao" placeholder="Peão">${suplenteTag}</td>
        <td><input type="date"></td>
        <td><input placeholder="Cartão"></td>

        <td>${removerBtn}</td>
      `;
    }

    /* DANÇAS SALÃO */
    if (tipo === "par") {
      row.innerHTML = `
        <td><input class="input-prenda" placeholder="Prenda">${suplenteTag}</td>
        <td><input type="date"></td>
        <td><input placeholder="Cartão"></td>

        <td><input class="input-peao" placeholder="Peão"></td>
        <td><input type="date"></td>
        <td><input placeholder="Cartão"></td>

        <td>${removerBtn}</td>
      `;
    }

    /* DANÇAS TRADICIONAIS */
    if (tipo === "tradicional") {
      row.innerHTML = `
        <td><input class="input-prenda" placeholder="Prenda">${suplenteTag}</td>
        <td><input type="date"></td>
        <td><input placeholder="Cartão"></td>

        <td><input class="input-peao" placeholder="Peão"></td>
        <td><input type="date"></td>
        <td><input placeholder="Cartão"></td>

        <td><input class="input-danca" required placeholder="Dança Tradicional"></td>

        <td>${removerBtn}</td>
      `;
    }

    tbody.appendChild(row);
  }

  function removeRow(btn) {
    btn.closest("tr").remove();
  }

  /* Renderizar */
  const container = document.getElementById("modalidades");

  modalidades.forEach(mod => {
    container.innerHTML += `<div class="section-title">${mod.nome}</div>`;

    categorias.forEach(cat => {
      container.appendChild(criarCategoria(mod.id, cat, mod.tipo));
      addRow(mod.id, cat, mod.tipo);
    });
  });
</script>

</body>
</html>
